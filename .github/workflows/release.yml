name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Package Chrome extension
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath WeirdHost-Presence-Extension.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: weirdhost-presence-windows
          path: |
            dist/*.exe
            dist/latest.yml
            WeirdHost-Presence-Extension.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            WeirdHost-Presence-Extension.zip
          generate_release_notes: true
